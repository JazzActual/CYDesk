; CYDesk — PlatformIO project configuration
;
; Four boards, four builds. `pio run` and `pio run -t upload` use the 2.8"
; resistive board that is usually plugged in. Uploading the wrong one paints
; garbage (or leaves touch dead).
;
;   e32r28t    2.8" E32R28T / ESP32-2432S028      ILI9341  240×320   XPT2046 resistive
;   nicemcu28  2.8" NiceMCU-32S-DEV_2.8IPS        ST7789   240×320   CST816D capacitive
;   cyd35      3.5" ESP32-3248S035R               ST7796   320×480   XPT2046 shared SPI
;   cyd40      4.0" E32R40T / ESP32-32E           ST7796   320×480   XPT2046 shared SPI
;
; Other capacitive CYD panels ending in C, and the Guition 480×480 ESP32-S3
; (4848S040), are not these builds.
;
; All display settings for TFT_eSPI live in build_flags (USER_SETUP_LOADED),
; so nothing inside .pio/libdeps ever needs editing.

[platformio]
default_envs = e32r28t

[env]
; Pin to the Arduino-ESP32 2.x / IDF 4.4 line the checked-in images were
; built with. Platform 8 pulls Arduino 3.x, which breaks WiFiManager's
; WebServer include (FS is under the fs:: namespace there).
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; 921600 gave "Invalid head of packet" errors through this board's CH340
; USB chip. 460800 is reliable and still fast (~10 s per upload).
upload_speed = 460800
; The board's USB chip (CH340) shows up on macOS as /dev/cu.usbserial-<number>.
; The wildcard keeps PlatformIO off Bluetooth ports and copes with any USB socket.
upload_port = /dev/cu.usbserial-*
monitor_port = /dev/cu.usbserial-*
; Decodes crash dumps in the serial monitor into readable file:line info.
monitor_filters = esp32_exception_decoder
; Packs the browser-installer image after every build.
; The pre script rewrites this computer's home folder out of file paths
; before anything is compiled, so the image never contains a username.
extra_scripts =
  pre:tools/hide_build_paths.py
  pre:tools/embed_version.py
  tools/stage_flasher.py
; Two ~1.9 MB OTA slots + tiny SPIFFS (min_spiffs). App is ~1.3 MB today, so
; there is headroom. NVS stays at 0x9000 (same as huge_app). The web flasher
; ships separate images that skip that range, so USB update without erase
; keeps Wi-Fi and keys. Do not switch back to huge_app without dropping
; ArduinoOTA / HTTPS channel OTA.
board_build.partitions = min_spiffs.csv

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  ; Registry copy is a 2019 snapshot; v1.4 from GitHub adds begin(SPIClass&)
  ; so the 2.8" resistive touch chip can use its own SPI bus.
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2

; Shared TFT_eSPI options (fonts). Display pins and SPI clock differ on the
; NiceMCU capacitive board, so those live per-env / in cyd_resistive_spi.
build_flags =
  -D USER_SETUP_LOADED=1
  -D DISABLE_ALL_LIBRARY_WARNINGS=1
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT7=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1

; Classic CYD resistive family: same HSPI wiring (MISO 12, DC 2, no reset GPIO).
[cyd_resistive_spi]
build_flags =
  -D USE_HSPI_PORT=1
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000

; ---- 2.8" resistive ---------------------------------------------------------
[env:e32r28t]
build_flags =
  ${env.build_flags}
  ${cyd_resistive_spi.build_flags}
  -D BOARD_CYD28=1
  ; Original E32R28T = ILI9341. A 2025 E32R28T-1 is an ST7789: swap these two.
  -D ILI9341_2_DRIVER=1
  ; -D ST7789_DRIVER=1
  ; -D TFT_INVERSION_OFF=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_BL=21

; ---- 2.8" capacitive (NiceMCU-32S-DEV_2.8IPS) --------------------------------
; Pins from NiceMCU board_config / nicemcu_display: ST7789 on SPI, CST816D on
; I2C. Shared reset GPIO 2 for panel + touch. Not the resistive E32R28T.
[env:nicemcu28]
build_flags =
  ${env.build_flags}
  -D BOARD_NICEMCU28=1
  -D USE_HSPI_PORT=1
  -D ST7789_DRIVER=1
  -D TFT_INVERSION_ON=1
  ; Panel swaps red/blue unless BGR (confirmed on-device color bars).
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=12
  -D TFT_RST=2
  -D TFT_MISO=-1
  -D TFT_BL=25
  ; Vendor sample runs the panel at 24 MHz.
  -D SPI_FREQUENCY=24000000
  -D SPI_READ_FREQUENCY=20000000

; ---- 3.5" resistive (ESP32-3248S035R) ---------------------------------------
; The capacitive "C" board uses a different touch chip and is not this build.
; Colours are BGR on this panel. Backlight is GPIO 27, not 21.
; Touch shares the display SPI bus (TOUCH_CS); keep its clock low.
[env:cyd35]
build_flags =
  ${env.build_flags}
  ${cyd_resistive_spi.build_flags}
  -D BOARD_CYD35=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_BL=27
  -D TOUCH_CS=33
  -D SPI_TOUCH_FREQUENCY=2500000

; ---- 4.0" resistive (E32R40T / ESP32-32E) -----------------------------------
; Same 320×480 ST7796 + shared-SPI XPT2046 as the 3.5" R board. Backlight is
; GPIO 27. RGB LED red is GPIO 22 (like the 2.8"), not GPIO 4. No-touch
; E32N40T and capacitive 4" boards are not this build.
[env:cyd40]
build_flags =
  ${env.build_flags}
  ${cyd_resistive_spi.build_flags}
  -D BOARD_CYD40=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_BL=27
  -D TOUCH_CS=33
  -D SPI_TOUCH_FREQUENCY=2500000
