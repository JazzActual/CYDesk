; CYDesk — PlatformIO project configuration
;
; Board: LCDwiki / QDtech E32R28T (2.8" 240x320, ESP32-WROOM-32E, no PSRAM).
; All display settings for the TFT_eSPI library live here in build_flags
; (USER_SETUP_LOADED), so nothing inside .pio/libdeps ever needs editing.

[env:e32r28t]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 921600 gave "Invalid head of packet" errors through this board's CH340
; USB chip. 460800 is reliable and still fast (~10 s per upload).
upload_speed = 460800
; The board's USB chip (CH340) shows up on macOS as /dev/cu.usbserial-<number>.
; The wildcard keeps PlatformIO off Bluetooth ports and copes with any USB socket.
upload_port = /dev/cu.usbserial-*
monitor_port = /dev/cu.usbserial-*
; Decodes crash dumps in the serial monitor into readable file:line info.
monitor_filters = esp32_exception_decoder
; Bigger app partition (3 MB, no OTA). Wi-Fi + HTTPS + fonts add up fast.
board_build.partitions = huge_app.csv

; Libraries are added step by step as features need them.
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  ; Registry copy is a 2019 snapshot; v1.4 from GitHub adds begin(SPIClass&)
  ; so the touch chip can use its own SPI bus.
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  ; Captive-portal setup page (Wi-Fi + our own settings fields).
  tzapu/WiFiManager@^2.0.17
  ; Reads the JSON replies from WeatherAPI, keeping only the fields we need.
  bblanchon/ArduinoJson@^7.2
  ; Draws a baseline JPEG straight to the display, a few rows at a time,
  ; so the badge page doesn't need a full-screen picture in memory.
  bodmer/TJpg_Decoder@^1.1.0

build_flags =
  -D USER_SETUP_LOADED=1
  ; Touch is handled by the XPT2046 library, not TFT_eSPI; silences its warning.
  -D DISABLE_ALL_LIBRARY_WARNINGS=1

  ; ---- Display driver ------------------------------------------------------
  ; Original E32R28T = ILI9341. If the screen stays white/blank or the colour
  ; bars are wrong, it's probably the 2025 E32R28T-1 (ST7789): comment out the
  ; ILI9341 line and uncomment the ST7789 lines below.
  -D ILI9341_2_DRIVER=1
  ; -D ST7789_DRIVER=1
  ; -D TFT_INVERSION_OFF=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320

  ; ---- LCD pins (HSPI) -----------------------------------------------------
  ; The ESP32 has two usable SPI buses, HSPI and VSPI. The touch controller
  ; needs VSPI for its own pins, so the display goes on HSPI.
  -D USE_HSPI_PORT=1
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1          ; LCD reset is wired to the ESP32's EN (reset) pin
  -D TFT_BL=21           ; backlight
  -D TFT_BACKLIGHT_ON=HIGH

  ; ---- Fonts ---------------------------------------------------------------
  -D LOAD_GLCD=1         ; font 1: tiny 8px
  -D LOAD_FONT2=1        ; font 2: small 16px
  -D LOAD_FONT4=1        ; font 4: medium 26px
  -D LOAD_FONT7=1        ; font 7: 7-segment digits (clock-style)
  -D LOAD_GFXFF=1        ; FreeFonts (FreeSans etc.)
  -D SMOOTH_FONT=1

  ; ---- SPI speed -----------------------------------------------------------
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
